{% extends 'SProvider/design1.html' %}
{% block title %}Deepfake Prediction Ratio Charts | Admin Console{% endblock %}

{% block researchblock %}
<div class="container-fluid px-lg-4">
    <div class="card card-custom">
        <div class="card-header-custom d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div>
                <h5 class="mb-1 fw-bold text-white">
                    <i class="fa-solid fa-chart-pie text-info me-2"></i> Real vs Fake Prediction Ratio Visualization
                </h5>
                <p class="text-secondary small mb-0">Visual distribution of authentic vs manipulated media transactions</p>
            </div>
            <!-- Chart type switcher buttons -->
            <div class="btn-group rounded-pill p-1 bg-dark border border-secondary border-opacity-50">
                <a href="{% url 'charts' 'pie' %}" class="btn btn-sm {% if chart_type == 'pie' %}btn-info text-dark fw-bold{% else %}btn-dark text-secondary{% endif %} rounded-pill px-3">
                    <i class="fa-solid fa-chart-pie me-1"></i> Pie Chart
                </a>
                <a href="{% url 'charts' 'doughnut' %}" class="btn btn-sm {% if chart_type == 'doughnut' %}btn-info text-dark fw-bold{% else %}btn-dark text-secondary{% endif %} rounded-pill px-3">
                    <i class="fa-solid fa-circle-notch me-1"></i> Donut
                </a>
                <a href="{% url 'charts' 'bar' %}" class="btn btn-sm {% if chart_type == 'bar' %}btn-info text-dark fw-bold{% else %}btn-dark text-secondary{% endif %} rounded-pill px-3">
                    <i class="fa-solid fa-chart-bar me-1"></i> Bar
                </a>
                <a href="{% url 'charts' 'line' %}" class="btn btn-sm {% if chart_type == 'line' %}btn-info text-dark fw-bold{% else %}btn-dark text-secondary{% endif %} rounded-pill px-3">
                    <i class="fa-solid fa-chart-line me-1"></i> Line
                </a>
            </div>
        </div>

        <div class="card-body p-4">
            <div class="row justify-content-center">
                <div class="col-lg-8" style="position: relative; min-height: 400px; max-height: 520px;">
                    <canvas id="ratioChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const labels = [
        {% for o in form %}
            "{{ o.names }}",
        {% endfor %}
    ];

    const data = [
        {% for o in form %}
            {{ o.dcount }},
        {% endfor %}
    ];

    const backgroundColors = labels.map(l => {
        return l.toUpperCase().includes('REAL') ? 'rgba(16, 185, 129, 0.75)' : 'rgba(244, 63, 94, 0.75)';
    });

    const borderColors = labels.map(l => {
        return l.toUpperCase().includes('REAL') ? '#10b981' : '#f43f5e';
    });

    const ctx = document.getElementById('ratioChart').getContext('2d');
    const chartType = "{{ chart_type|default:'pie' }}";

    new Chart(ctx, {
        type: (chartType === 'spline') ? 'line' : chartType,
        data: {
            labels: labels,
            datasets: [{
                label: 'Prediction Ratio (%)',
                data: data,
                backgroundColor: backgroundColors,
                borderColor: borderColors,
                borderWidth: 2,
                borderRadius: chartType === 'bar' ? 8 : 0,
                fill: chartType === 'line' ? true : false,
                tension: 0.35
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: '#cbd5e1',
                        font: { size: 13, weight: '600' }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` ${context.label}: ${context.parsed.y !== undefined ? context.parsed.y : context.parsed}%`;
                        }
                    }
                }
            },
            scales: (chartType === 'bar' || chartType === 'line') ? {
                y: {
                    beginAtZero: true,
                    max: 100,
                    grid: { color: 'rgba(255, 255, 255, 0.08)' },
                    ticks: { color: '#94a3b8', callback: v => v + '%' }
                },
                x: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: { color: '#cbd5e1' }
                }
            } : {}
        }
    });
});
</script>
{% endblock %}
