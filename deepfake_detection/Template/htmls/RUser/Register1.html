<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection | User Registration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #090d16;
            --surface-card: #151d2f;
            --surface-border: #2e3c54;
            --primary-accent: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }

        .auth-container {
            max-width: 800px;
            width: 100%;
        }

        .auth-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            padding: 2.5rem;
        }

        .form-control, .form-select {
            background-color: #0c1220 !important;
            border: 1px solid var(--surface-border) !important;
            color: #fff !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-accent) !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25) !important;
        }

        .btn-custom {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 0.85rem;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .btn-custom:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show border-0 rounded-4 mb-3" role="alert">
                    <i class="fa-solid fa-circle-info me-2"></i>{{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                    <i class="fa-solid fa-user-plus fa-2x"></i>
                </div>
                <h3 class="fw-bold text-white mb-1">Create Forensic Account</h3>
                <p class="text-secondary small">Register to perform video manipulation and deepfake analysis</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-semibold">Username *</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-semibold">Email Address *</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-semibold">Password *</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter secure password" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label text-secondary small fw-semibold">Phone Number</label>
                        <input type="text" name="phoneno" class="form-control" placeholder="+1 (555) 000-0000">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label text-secondary small fw-semibold">Country</label>
                        <input type="text" name="country" class="form-control" placeholder="e.g. India, United States">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label text-secondary small fw-semibold">State / Province</label>
                        <input type="text" name="state" class="form-control" placeholder="e.g. Karnataka, California">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label text-secondary small fw-semibold">City</label>
                        <input type="text" name="city" class="form-control" placeholder="e.g. Bangalore, New York">
                    </div>

                    <div class="col-12">
                        <label class="form-label text-secondary small fw-semibold">Address</label>
                        <input type="text" name="address" class="form-control" placeholder="Street Address / Institution">
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-custom w-100">
                            <i class="fa-solid fa-check-circle me-2"></i> Register Account
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                    <span class="text-secondary small">Already have an account?</span>
                    <a href="{% url 'login' %}" class="text-primary text-decoration-none small fw-semibold ms-1">
                        Sign In Here
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
